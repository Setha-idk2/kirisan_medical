<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Explore the Kirisan Medical product. Filter and search through our complete selection of adult and child toothpase.">
  <title>All Products - Kirisan Medical</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="js/script.js" defer></script>
</head>
<body>
  <header class="site-header" id="navbar-component"></header>

  <main class="content">
    <section class="products-section">
      <div class="page-intro">
        <h2>All Products</h2>
      </div>

      <div class="filter-container">
        <input 
          type="text" 
          id="search-input" 
          class="filter-input" 
          placeholder="Search by name, subcategory, flavour, or size..." 
        />
        <select id="subcategory-filter" class="filter-select">
          <option value="all">All Subcategories</option>
          <option value="adult">Adult Toothpaste</option>
          <option value="child">Child Toothpaste</option>
        </select>
        <select id="flavour-filter" class="filter-select">
          <option value="all">All Flavours</option>
        </select>
      </div>

      <div class="product-grid" id="all-products"></div>
      <div id="no-results" class="no-results" style="display: none;">
        <p>No products match your search criteria.</p>
      </div>
    </section>
  </main>

  <footer class="site-footer" id="footer-component"></footer>
</body>
</html>
